<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Gateway Monitor</title>
<style>
  :root{--bg:#0f1420;--panel:#161c2b;--panel2:#1d2538;--line:#2a3447;--fg:#e7ecf5;
    --muted:#93a0b8;--cyan:#35d0e0;--green:#44d07b;--red:#ff6b6b;--accent:#7aa2ff;--amber:#ffb454;}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#f4f6fb;--panel:#fff;--panel2:#eef1f7;--line:#dce1ea;--fg:#141a26;
    --muted:#5b6678;--cyan:#0b8fa3;--green:#1b9e55;--red:#d33;--accent:#3762d6;--amber:#b26a00;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,Arial}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650}
  .dots{display:flex;gap:12px;margin-left:auto;font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:5px}
  .dot.up{background:var(--green)}.dot.down{background:var(--red)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  input#prompt{flex:1;min-width:240px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  button{cursor:pointer;background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:650;border-radius:8px;padding:8px 14px;font:inherit}
  button.sec{background:var(--panel2);color:var(--fg)}
  label.chk{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
  .hint{color:var(--muted);font-size:12px}
  main{padding:14px 18px}
  .call{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .call.fail{border-color:var(--red)}
  .call .hd{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  .tag.ok{color:var(--green);border-color:var(--green)}
  .tag.fail{color:var(--red);border-color:var(--red)}
  .tag.poison{color:var(--red);border-color:var(--red)}
  .seg{margin-top:6px}
  .seg .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:3px}
  .hl{background:rgba(255,107,107,.22);color:var(--red);border-radius:3px;padding:0 2px}
  .tc{color:var(--cyan)}
  .muted{color:var(--muted)}
  details summary{cursor:pointer;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AI Gateway Monitor <span class="hint">LiteLLM :4000 · no Straiker yet</span></h1>
  <div class="dots">
    <span><i class="dot" id="d-gateway"></i>gateway</span>
    <span><i class="dot" id="d-ollama"></i>ollama</span>
  </div>
</header>

<div class="controls">
  <input id="prompt" placeholder="Send a test prompt through the gateway…">
  <button id="send">Send through gateway</button>
  <button class="sec" id="reset">Clear traffic</button>
  <label class="chk"><input type="checkbox" id="auto" checked> auto-refresh</label>
  <span class="hint" id="count"></span>
</div>

<main>
  <div id="list"><div class="muted">No traffic yet. Send a test prompt above, or point an agent at http://127.0.0.1:4000 (model <code>lab-model</code>, key <code>sk-lab-master</code>).</div></div>
</main>

<script>
const $=s=>document.querySelector(s);
function esc(s){return(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s){return esc(s).replace(/(LAB-CANARY-[A-Z0-9]{8,})/g,'<span class="hl">$1</span>')
  .replace(/(\d{3}-\d{2}-\d{4})/g,'<span class="hl">$1</span>')
  .replace(/(sk-live-[A-Za-z0-9]+)/g,'<span class="hl">$1</span>');}

function lastUser(messages){
  if(!Array.isArray(messages)) return "";
  for(let i=messages.length-1;i>=0;i--){ if(messages[i] && messages[i].role==="user"){
    const c=messages[i].content; return typeof c==="string"?c:JSON.stringify(c); } }
  return "";
}
function respText(r){
  try{ const m=r.choices[0].message; let out=m.content||"";
    if(m.tool_calls&&m.tool_calls.length){ out+=(out?"\n":"")+m.tool_calls.map(t=>`→ ${t.function.name}(${t.function.arguments})`).join("\n"); }
    return out||"(empty)"; }catch(_){ return typeof r==="string"?r:JSON.stringify(r); }
}
function usage(r){ try{const u=r.usage; return u?`${u.prompt_tokens||u.input_tokens||'?'} in / ${u.completion_tokens||u.output_tokens||'?'} out`:""; }catch(_){return "";} }

function render(items){
  $('#count').textContent = items.length ? items.length+" call(s)" : "";
  if(!items.length){ return; }
  $('#list').innerHTML = items.slice().reverse().map(c=>{
    const fail=c.outcome==="failure";
    const toolNames=Array.isArray(c.tools)?c.tools.map(t=>t.function?t.function.name:t.name).filter(Boolean):[];
    const poison=JSON.stringify(c.tools||"").includes("SYSTEM DIRECTIVE");
    const rtc=(()=>{try{return c.response.choices[0].message.tool_calls||[]}catch(_){return[]}})();
    return `<div class="call ${fail?'fail':''}">
      <div class="hd">
        <span class="tag ${fail?'fail':'ok'}">${esc(c.outcome||'')}</span>
        <span>${esc(c.model||'')}</span>
        <span>${esc((c.ts||'').replace('T',' ').replace('Z',''))}</span>
        ${toolNames.length?`<span class="tag">tools: ${esc(toolNames.join(', '))}</span>`:''}
        ${poison?'<span class="tag poison">poisoned tool</span>':''}
        ${rtc.length?'<span class="tag" style="color:var(--amber);border-color:var(--amber)">model called a tool</span>':''}
        <span style="margin-left:auto" class="muted">${esc(usage(c.response))}</span>
      </div>
      <div class="seg"><span class="k">prompt (last user turn)</span><div class="mono">${hl(lastUser(c.messages))}</div></div>
      <div class="seg"><span class="k">gateway response</span><div class="mono">${hl(respText(c.response))}</div></div>
      <details class="seg"><summary>full messages + tools</summary>
        <div class="mono">${esc(JSON.stringify(c.messages,null,2))}</div>
        ${c.tools?`<div class="mono">${hl(JSON.stringify(c.tools,null,2))}</div>`:''}</details>
    </div>`;
  }).join('');
}

async function load(){ try{ render(await (await fetch('/api/traffic')).json()); }catch(_){}}
$('#send').onclick=async()=>{
  const p=$('#prompt').value.trim(); if(!p) return;
  $('#send').disabled=true; $('#send').textContent='sending…';
  try{ await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})}); }catch(_){}
  $('#send').disabled=false; $('#send').textContent='Send through gateway'; load();
};
$('#reset').onclick=async()=>{ await fetch('/api/reset'); load(); };
async function health(){ try{const h=await (await fetch('/health')).json();
  $('#d-gateway').className='dot '+(h.gateway?'up':'down'); $('#d-ollama').className='dot '+(h.ollama?'up':'down'); }catch(_){}}
setInterval(()=>{ if($('#auto').checked) load(); }, 2000);
setInterval(health,3000); health(); load();
</script>
</body>
</html>
